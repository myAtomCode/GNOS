[package]
name = "v-kernel"
version = "0.1.0"
edition = "2021"
description = "Rustix bootable microkernel prototype"
license = "MIT"
build = "build.rs"

[features]
default = ["board-qemu-virt"]
compat-monitor = []
busybox = []
board-qemu-virt = []
board-rpi5 = []

[[bin]]
name = "v-kernel"
path = "src/main.rs"
test = false
bench = false

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = "0.15.5"

[dependencies]

[profile.dev]
panic = "abort"
lto = true
opt-level = "s"
overflow-checks = false

[profile.release]
panic = "abort"
# Keep the custom high-half image and low boot trampoline in one predictable codegen unit.
lto = false
# The BIOS loader stages below the VGA aperture; size optimization keeps the
# flat kernel inside that hard boundary while retaining optimized code.
opt-level = "s"
overflow-checks = false
codegen-units = 1
incremental = false
